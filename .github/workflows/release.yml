# Publishes @mrigankad/aiemcee to GitHub Packages when a release is published.
#
# No personal access token is needed: the workflow's built-in GITHUB_TOKEN
# carries `packages: write`, which is why publishing lives here rather than
# on someone's laptop.
name: Publish package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@mrigankad"
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify the tag matches package.json
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $PKG"
            exit 1
          fi
          echo "publishing $PKG"

      - name: Smoke test the CLI
        run: |
          node bin/aiemcee.mjs --version
          node bin/aiemcee.mjs init /tmp/smoke
          test -f /tmp/smoke/scripts/compose.mjs

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
